    <script>
      // Filter benign Vite development websocket reconnection messages from triggering false AIS error warnings
      (function() {
        function isViteMessage(args) {
          try {
            for (var i = 0; i < args.length; i++) {
              var item = args[i];
              var str = (item && (item.message || item.stack || '' + item)) || '';
              if (typeof str === 'string') {
                var lower = str.toLowerCase();
                if (lower.indexOf('[vite]') !== -1 || lower.indexOf('vite:') !== -1 || lower.indexOf('websocket') !== -1 || lower.indexOf('ws://') !== -1 || lower.indexOf('wss://') !== -1) {
                  return true;
                }
              }
            }
          } catch(e) {}
          return false;
        }

        var origError = console.error;
        var origWarn = console.warn;
        var origLog = console.log;
        var origInfo = console.info;
        var origDebug = console.debug;

        console.error = function() {
          if (isViteMessage(arguments)) return;
          origError.apply(console, arguments);
        };
        console.warn = function() {
          if (isViteMessage(arguments)) return;
          origWarn.apply(console, arguments);
        };
        console.log = function() {
          if (isViteMessage(arguments)) return;
          origLog.apply(console, arguments);
        };
        console.info = function() {
          if (isViteMessage(arguments)) return;
          origInfo.apply(console, arguments);
        };
        console.debug = function() {
          if (isViteMessage(arguments)) return;
          if (origDebug) origDebug.apply(console, arguments);
        };

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var str = (reason && (reason.message || reason.stack || '' + reason)) || '';
          if (typeof str === 'string' && (str.indexOf('[vite]') !== -1 || str.indexOf('websocket') !== -1)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });

        window.addEventListener('error', function(event) {
          var msg = (event && (event.message || '')) || '';
          if (typeof msg === 'string' && (msg.indexOf('[vite]') !== -1 || msg.indexOf('websocket') !== -1)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>

    <script>
      // Single Page Apps for GitHub Pages redirect receiver
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
